<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fef3c7" />
    <title>NanaSpork · BananaGram</title>
    <style>
      #boot-status {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #fffbeb;
        color: #451a03;
      }
      #boot-status > div {
        max-width: 420px;
        padding: 24px;
        border: 1px solid #fde68a;
        border-radius: 24px;
        background: white;
        box-shadow: 0 16px 40px rgb(120 53 15 / 12%);
      }
      #boot-status h1 { font-size: 1.15rem; margin: 10px 0 6px; }
      #boot-status p { margin: 0; line-height: 1.5; font-size: 0.9rem; }
    </style>
  </head>
  <body class="bg-amber-50/50 text-amber-950 selection:bg-amber-200">
    <div id="root">
      <div id="boot-status" role="status">
        <div>
          <span aria-hidden="true">🍌</span>
          <h1>Opening NanaSpork…</h1>
          <p>The Garden is gathering this device’s local state.</p>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const showBootFailure = (reason) => {
          const root = document.getElementById('root');
          if (!root || root.dataset.appMounted === 'true') return;
          root.replaceChildren();
          const shell = document.createElement('div');
          shell.id = 'boot-status';
          shell.setAttribute('role', 'alert');
          const card = document.createElement('div');
          const icon = document.createElement('span');
          icon.textContent = '🍌';
          const title = document.createElement('h1');
          title.textContent = 'NanaSpork could not finish starting.';
          const detail = document.createElement('p');
          detail.textContent =
            reason ||
            'Close and reopen the app. If this continues, verify the published client configuration.';
          card.append(icon, title, detail);
          shell.append(card);
          root.append(shell);
        };

        window.addEventListener('error', (event) => {
          showBootFailure(event.message || 'A startup module failed to load.');
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason =
            event.reason instanceof Error ? event.reason.message : 'A startup request failed.';
          showBootFailure(reason);
        });
        window.setTimeout(() => {
          showBootFailure('Startup timed out before the application mounted.');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
