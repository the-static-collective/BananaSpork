<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NanaSpork recovery</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #fffbeb;
        color: #451a03;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        padding: 24px;
        border: 1px solid #fcd34d;
        border-radius: 24px;
        background: white;
        box-shadow: 0 16px 40px rgb(120 53 15 / 12%);
      }
      h1 { font-size: 1.25rem; }
      p { line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true">🍌</div>
      <h1>NanaSpork could not open its local app files.</h1>
      <p>
        Close and reopen the app. Reinstall only if this continues: reinstalling
        removes device-local drafts and held notes. Shared Campfire history, when
        configured, remains on the authority server.
      </p>
    </main>
  </body>
</html>
